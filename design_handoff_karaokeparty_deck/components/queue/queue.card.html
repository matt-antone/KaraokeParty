<!-- @dsCard group="Components" viewport="700x240" name="Song history" subtitle="A record — sung songs are locked, so the only control is the star" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const need = ['Button', 'Panel', 'QueueItem'];
  const skip = new Set(['top', 'parent', 'self', 'window', 'frames', 'opener', 'globalThis']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && need.every(n => typeof v[n] === 'function')) return v;
    } catch (e) { /* cross-origin frame */ }
  }
  return {};
})();

if (!NS.Button) {
  document.getElementById('root').innerHTML =
    '<pre style="font:12px ui-monospace,monospace;color:#ff8a1e;white-space:pre-wrap">'
    + 'Design-system bundle not loaded (_ds_bundle.js).\nThis card renders once the project is compiled as a Design System.'
    + '</pre>';
}

const { Panel, SongHistoryList } = NS;

const sung = [
  { title: 'Sweet Caroline', artist: 'Neil Diamond', date: 'Aug 29', isStarred: true },
  { title: 'Total Eclipse of the Heart', artist: 'Bonnie Tyler', date: 'Aug 15' },
];

function Card () {
  return (
    <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
      <div style={{ flex: 1, maxWidth: 340 }}>
        <span className="lbl">with songs</span>
        <Panel title="Sung Tonight" contentStyle={{ padding: 0 }}>
          <SongHistoryList items={sung} onStar={() => {}} />
        </Panel>
      </div>
      <div style={{ flex: 1, maxWidth: 340 }}>
        <span className="lbl">empty</span>
        <Panel title="Sung Tonight" contentStyle={{ padding: 0 }}>
          <SongHistoryList items={[]} />
        </Panel>
      </div>
    </div>
  );
}

if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
