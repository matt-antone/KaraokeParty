<!-- @dsCard group="Components" viewport="700x390" name="Chrome" subtitle="Your Turn header, transport, tabs, bottom nav, scanner" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const need = ['Button', 'Panel', 'QueueItem'];
  // 'top'/'parent' etc. are cross-origin Windows; reading a named property off
  // them throws SecurityError, so skip them and guard every other read.
  const skip = new Set(['top', 'parent', 'self', 'window', 'frames', 'opener', 'globalThis']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && need.every(n => typeof v[n] === 'function')) return v;
    } catch (e) { /* cross-origin frame */ }
  }
  return {};
})();

if (!NS.Button) {
  document.getElementById('root').innerHTML =
    '<pre style="font:12px ui-monospace,monospace;color:#ff8a1e;white-space:pre-wrap">'
    + 'Design-system bundle not loaded (_ds_bundle.js).\nThis card renders once the project is compiled as a Design System.'
    + '</pre>';
}

const { Navigation, YourTurn, PlaybackCtrl, Tabs, ProgressBar, LibraryHeader } = NS;

function Card () {
  const [nav, setNav] = React.useState('queue');
  const [tab, setTab] = React.useState('queue');
  const [playing, setPlaying] = React.useState(true);
  const [vol, setVol] = React.useState(0.78);
  const [facets, setFacets] = React.useState(['rock']);

  return (
    <div className="col" style={{ gap: 14 }}>
      <div className="col">
        <span className="lbl">transport &mdash; settings &gt; player only</span>
        <div style={{ background: 'var(--brush)', borderRadius: 'var(--radius-panel)', boxShadow: 'var(--bevel)' }}>
          <PlaybackCtrl
            isPlaying={playing}
            volume={vol}
            showFullscreen
            onPlay={() => setPlaying(true)}
            onPause={() => setPlaying(false)}
            onVolumeChange={setVol}
          />
        </div>
      </div>

      <div className="col">
        <span className="lbl">your turn &mdash; the app header</span>
        <div className="row" style={{ gap: 12, alignItems: 'flex-start' }}>
          <YourTurn wait="4 min" position={2} rotationSize={4} songCount={2} style={{ flex: 1 }} />
          <YourTurn isUpNow position={1} rotationSize={4} songCount={2} style={{ flex: 1 }} />
          <YourTurn isPaused wait="4 min" position={2} rotationSize={4} songCount={2} style={{ flex: 1 }} />
        </div>
      </div>

      <div className="row" style={{ alignItems: 'flex-end', gap: 16 }}>
        <div className="col" style={{ flex: 1, minWidth: 240 }}>
          <span className="lbl">tabs</span>
          <Tabs
            active={tab}
            onChange={setTab}
            tabs={[{ id: 'queue', label: 'Queue', count: 8 }, { id: 'me', label: 'Me', count: 2 }, { id: 'history', label: 'History', count: 14 }]}
          />
        </div>
        <div className="col" style={{ width: 240 }}>
          <span className="lbl">bottom nav</span>
          <Navigation active={nav} isAdmin onNavigate={setNav} style={{ borderRadius: 'var(--radius-panel)' }} />
        </div>
      </div>

      <div className="col">
        <span className="lbl">library header &mdash; latching facet keys</span>
        <div style={{ background: 'var(--brush)', borderRadius: 'var(--radius-panel)', boxShadow: 'var(--bevel)' }}>
          <LibraryHeader
            query=""
            facets={['rock', 'pop', '80s', 'belter']}
            activeFacets={facets}
            onFacetToggle={fa => setFacets(p => p.includes(fa) ? p.filter(x => x !== fa) : [...p, fa])}
            artistCount={214}
            songCount={1809}
          />
          <ProgressBar isActive pct={42} text="Scanning /media/new-2026" />
        </div>
      </div>
    </div>
  );
}

if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
