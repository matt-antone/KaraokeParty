<!-- @dsCard group="Components" viewport="700x330" name="Player overlays" subtitle="Intermission, idle, corner panels, empty" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const need = ['Button', 'Panel', 'QueueItem'];
  // 'top'/'parent' etc. are cross-origin Windows; reading a named property off
  // them throws SecurityError, so skip them and guard every other read.
  const skip = new Set(['top', 'parent', 'self', 'window', 'frames', 'opener', 'globalThis']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && need.every(n => typeof v[n] === 'function')) return v;
    } catch (e) { /* cross-origin frame */ }
  }
  return {};
})();

if (!NS.Button) {
  document.getElementById('root').innerHTML =
    '<pre style="font:12px ui-monospace,monospace;color:#ff8a1e;white-space:pre-wrap">'
    + 'Design-system bundle not loaded (_ds_bundle.js).\nThis card renders once the project is compiled as a Design System.'
    + '</pre>';
}

const { PlayerOverlay, PlayerHeadline } = NS;

const frame = { position: 'relative', flex: 1, minWidth: 170, height: 250, borderRadius: 'var(--radius-panel)', overflow: 'hidden', background: '#000', boxShadow: 'var(--bevel)' };
const video = { ...frame, background: 'linear-gradient(150deg,#2b2419,#141a1f 55%,#05070a)' };

function Card () {
  return (
    <div className="col" style={{ gap: 12 }}>
      <div className="row" style={{ gap: 10, alignItems: 'stretch' }}>
        <div style={frame}>
          <PlayerOverlay state="intermission" singer="Dana" nextTitle="Once in a Lifetime" nextArtist="Talking Heads" secondsLeft={9} comingUpSinger="Priya" comingUpTitle="Dreams" />
        </div>
        <div style={video}>
          <PlayerOverlay state="idle" queueDepth={8} />
        </div>
        <div style={video}>
          <PlayerOverlay state="upNow" singer="Dana" nextTitle="Dreams" nextArtist="Fleetwood Mac" queueDepth={8} />
          <div style={{ position: 'absolute', bottom: '16%', left: 0, right: 0, textAlign: 'center', color: '#fff', fontSize: 15, fontWeight: 600, textShadow: '0 2px 8px #000' }}>
            lyrics keep the lower third
          </div>
        </div>
        <div style={frame}>
          <PlayerOverlay state="empty" />
        </div>
      </div>
      <div className="row" style={{ gap: 20 }}>
        <PlayerHeadline size="26px" tone="vu">Dana</PlayerHeadline>
        <PlayerHeadline size="26px">Media failed</PlayerHeadline>
      </div>
    </div>
  );
}

if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
