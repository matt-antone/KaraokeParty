<!-- @dsCard group="Components" viewport="700x340" name="Surfaces" subtitle="Panel, accordion, empty state, solid modal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const need = ['Button', 'Panel', 'QueueItem'];
  // 'top'/'parent' etc. are cross-origin Windows; reading a named property off
  // them throws SecurityError, so skip them and guard every other read.
  const skip = new Set(['top', 'parent', 'self', 'window', 'frames', 'opener', 'globalThis']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && need.every(n => typeof v[n] === 'function')) return v;
    } catch (e) { /* cross-origin frame */ }
  }
  return {};
})();

if (!NS.Button) {
  document.getElementById('root').innerHTML =
    '<pre style="font:12px ui-monospace,monospace;color:#ff8a1e;white-space:pre-wrap">'
    + 'Design-system bundle not loaded (_ds_bundle.js).\nThis card renders once the project is compiled as a Design System.'
    + '</pre>';
}

const { Panel, Accordion, TextOverlay, Modal, Button, VuMeter } = NS;

function Card () {
  return (
    <div className="row" style={{ alignItems: 'flex-start', gap: 16 }}>
      <div className="col" style={{ width: 290 }}>
        <Panel title="Song History" contentStyle={{ padding: 0 }}>
          {[['Sweet Caroline', 'Neil Diamond', 'Aug 29'], ['Africa', 'Toto', 'Aug 15']].map(([t, a, d], i) => (
            <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 10, minHeight: 44, padding: '0 14px', borderTop: i ? 'var(--seam-rule)' : 'none' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 'var(--text-m)', fontWeight: 600 }}>{t}</div>
                <div className="silkscreen" style={{ letterSpacing: '.06em' }}>{a}</div>
              </div>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--ink-3)' }}>{d}</span>
            </div>
          ))}
        </Panel>
        <Accordion heading="Media Folders" initialExpanded>
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, marginBottom: 5 }}>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11 }}>/media/karaoke</span>
            <span className="silkscreen">1809 songs</span>
          </div>
          <VuMeter value={1} segments={18} peakFrom={2} height={5} />
        </Accordion>
      </div>

      <div style={{ width: 160 }}>
        <span className="lbl">empty state</span>
        <TextOverlay title="Queue Empty" style={{ minHeight: 150, padding: '20px 0' }}>
          Tap a song in the <a href="#library">library</a> to queue it.
        </TextOverlay>
      </div>

      <div style={{ position: 'relative', flex: 1, minWidth: 210, height: 300, borderRadius: 'var(--radius-panel)', overflow: 'hidden', background: 'linear-gradient(150deg,#2b2419,#141a1f 55%,#05070a)' }}>
        <Modal title="Display" onClose={() => {}} buttons={<Button tone="vu" block>Done</Button>}>
          <div className="col">
            <span className="lbl">solid, not frosted</span>
            <p style={{ margin: 0, fontSize: 'var(--text-m)', color: 'var(--ink-2)' }}>
              When you open a panel on a deck, you cannot see through it.
            </p>
          </div>
        </Modal>
      </div>
    </div>
  );
}

if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
