<!-- @dsCard group="Components" viewport="700x330" name="Core" subtitle="Keys, VU meter, knob, star, wordmark, spinner, icon set" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const need = ['Button', 'Panel', 'QueueItem'];
  // 'top'/'parent' etc. are cross-origin Windows; reading a named property off
  // them throws SecurityError, so skip them and guard every other read.
  const skip = new Set(['top', 'parent', 'self', 'window', 'frames', 'opener', 'globalThis']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && need.every(n => typeof v[n] === 'function')) return v;
    } catch (e) { /* cross-origin frame */ }
  }
  return {};
})();

if (!NS.Button) {
  document.getElementById('root').innerHTML =
    '<pre style="font:12px ui-monospace,monospace;color:#ff8a1e;white-space:pre-wrap">'
    + 'Design-system bundle not loaded (_ds_bundle.js).\nThis card renders once the project is compiled as a Design System.'
    + '</pre>';
}

const { Button, ButtonStar, SwipeRow, Icon, Logo, Mark, Spinner, VuMeter, Knob } = NS;

function Card () {
  const [starred, setStarred] = React.useState(true);
  const [expanded, setExpanded] = React.useState(true);
  const [vol, setVol] = React.useState(0.7);

  return (
    <div className="col" style={{ gap: 18 }}>
      <div className="row" style={{ alignItems: 'flex-start' }}>
        <div className="col" style={{ width: 150 }}>
          <span className="lbl">keys</span>
          <Button tone="vu" block>Sign In</Button>
          <Button tone="panel" block>Sign Out</Button>
          <Button tone="alert" block>Remove</Button>
        </div>

        <div className="col">
          <span className="lbl">icon keys &amp; flush glyphs</span>
          <div className="row" style={{ gap: 8 }}>
            <Button tone="vu" icon="PAUSE" iconSize={30} aria-label="Pause" />
            <Button tone="panel" icon="PLAY_NEXT" iconSize={26} aria-label="Skip" style={{ color: 'var(--vu)' }} />
            <Button tone="panel" icon="TUNE" iconSize={24} aria-label="Display" />
            <Button tone="flush" icon="DELETE" iconSize={22} aria-label="Remove" style={{ color: 'var(--alert)' }} />
          </div>
          <span className="lbl" style={{ marginTop: 6 }}>star &mdash; lit / unlit</span>
          <div className="row" style={{ gap: 8 }}>
            <ButtonStar isStarred={starred} count={4} onClick={() => setStarred(!starred)} />
            <ButtonStar isStarred={false} count={0} onClick={() => {}} />
            <ButtonStar isStarred count={12} onClick={() => {}} />
          </div>
          <span className="lbl" style={{ marginTop: 6 }}>swipe row &mdash; drag it left</span>
          <SwipeRow
            isOpen={expanded}
            onOpenChange={setExpanded}
            style={{ width: 300, boxShadow: 'var(--bevel)' }}
            actions={[
              { icon: 'MOVE_TOP', label: 'Top', tone: 'vu' },
              { icon: 'DELETE', label: 'Remove', tone: 'alert' },
            ]}
          >
            <div style={{ minHeight: 64, display: 'flex', alignItems: 'center', padding: '0 var(--gap-3)', background: 'var(--brush)', fontSize: 'var(--text-m)', fontWeight: 600 }}>
              Once in a Lifetime
            </div>
          </SwipeRow>
        </div>

        <div className="col" style={{ marginLeft: 'auto', minWidth: 190 }}>
          <span className="lbl">wordmark</span>
          <Logo withMark markSize={38} />
          <div className="row" style={{ gap: 10, marginTop: 4 }}>
            <Mark size={28} /><Mark size={22} />
          </div>
        </div>
      </div>

      <div className="row" style={{ gap: 24, alignItems: 'flex-end' }}>
        <div className="col" style={{ flex: 1, minWidth: 220 }}>
          <span className="lbl">vu meter &mdash; level 0.72</span>
          <VuMeter value={0.72} segments={24} />
          <span className="lbl" style={{ marginTop: 6 }}>progress &mdash; peaking off</span>
          <VuMeter value={0.42} segments={20} peakFrom={2} height={6} />
        </div>
        <div className="col">
          <span className="lbl">knob</span>
          <Knob value={vol} onChange={setVol} label="vol" />
        </div>
        <div className="col" style={{ width: 200 }}>
          <span className="lbl">spinner</span>
          <Spinner style={{ height: 40, padding: 0 }} />
        </div>
      </div>

      <div className="col">
        <span className="lbl">icon set &mdash; 48 single-path glyphs</span>
        <div className="row" style={{ gap: 9, color: 'var(--ink-2)' }}>
          {['NAV_LIBRARY','NAV_SUBSCRIPTIONS','NAV_ACCOUNT','TUNE','PLAY','PAUSE','PLAY_NEXT','REPLAY','FOLDER','FOLDER_MUSIC','MAGNIFIER','CLEAR','PLUS','DELETE','MOVE_TOP','DRAG_INDICATOR','QR_CODE','FULLSCREEN','TELEVISION_PLAY','VOLUME_UP','DICE','PERSON','PHOTO_ADD','LABEL','REFRESH','ALERT_OUTLINE','CHEVRON_RIGHT'].map(n => (
            <Icon key={n} icon={n} size={21} />
          ))}
        </div>
      </div>
    </div>
  );
}

if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
