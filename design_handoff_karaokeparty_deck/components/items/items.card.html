<!-- @dsCard group="Components" viewport="700x390" name="Rows" subtitle="Folder, song keys, queue channels (one swiped open), alpha rail" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const need = ['Button', 'Panel', 'QueueItem'];
  // 'top'/'parent' etc. are cross-origin Windows; reading a named property off
  // them throws SecurityError, so skip them and guard every other read.
  const skip = new Set(['top', 'parent', 'self', 'window', 'frames', 'opener', 'globalThis']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && need.every(n => typeof v[n] === 'function')) return v;
    } catch (e) { /* cross-origin frame */ }
  }
  return {};
})();

if (!NS.Button) {
  document.getElementById('root').innerHTML =
    '<pre style="font:12px ui-monospace,monospace;color:#ff8a1e;white-space:pre-wrap">'
    + 'Design-system bundle not loaded (_ds_bundle.js).\nThis card renders once the project is compiled as a Design System.'
    + '</pre>';
}

const { ArtistItem, SongItem, QueueItem, AlphaPicker } = NS;

function Card () {
  return (
    <div className="row" style={{ alignItems: 'flex-start', gap: 14 }}>
      <div style={{ flex: 1, minWidth: 350 }}>
        <span className="lbl">library</span>
        <div style={{ marginTop: 8 }}>
          <ArtistItem name="Talking Heads" songCount={8} isExpanded hasUpcomingChild />
          <div style={{ padding: '8px 0 4px' }}>
            <SongItem title="Once in a Lifetime" tags={['rock', '80s']} duration="4:19" isUpcoming />
            <SongItem title="This Must Be the Place" tags={['rock']} duration="4:56" isStarred numStars={2} />
            <SongItem title="Psycho Killer" tags={['rock', '70s']} duration="4:22" isPlayed numStars={1} />
          </div>
          <ArtistItem name="Fleetwood Mac" songCount={12} hasStarredChild />
        </div>

        <span className="lbl" style={{ display: 'block', margin: '16px 0 8px' }}>queue</span>
        <QueueItem
          isCurrent isPlaying pctPlayed={38}
          title="Dreams" artist="Fleetwood Mac" userDisplayName="Dana"
          isStarred starCount={3}
          actions={[{ icon: 'PLAY_NEXT', label: 'Skip', tone: 'alert' }]}
        />
        <QueueItem
          isUpcoming isOwner wait="4 min" isOpen
          title="Once in a Lifetime" artist="Talking Heads" userDisplayName="You"
          starCount={4}
          actions={[{ icon: 'MOVE_TOP', label: 'Top', tone: 'vu' }, { icon: 'DELETE', label: 'Remove', tone: 'alert' }]}
        />
        <QueueItem
          isPlayed title="Sweet Caroline" artist="Neil Diamond" userDisplayName="Sam"
          starCount={9}
        />
      </div>

      <div style={{ width: 40 }}>
        <span className="lbl">rail</span>
        <AlphaPicker active="T" style={{ height: 330, marginTop: 8 }} />
      </div>
    </div>
  );
}

if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
