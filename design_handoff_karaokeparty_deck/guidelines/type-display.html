<!-- @dsCard group="Type" viewport="700x220" name="Michroma display" subtitle="Wordmark and player only — never body copy, never over three words" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  
</style>
</head>
<body>

<div style="font-family:var(--font-display);font-size:34px;letter-spacing:.1em;line-height:1.2">DANA</div>
<div style="font-family:var(--font-display);font-size:18px;letter-spacing:.13em;line-height:1.5;margin-top:14px">KARAOKE<br><span style="color:var(--vu)">PARTY</span></div>
<p class="note">'Michroma' · --font-display. Wide, technical, slow to read. Always uppercase, tracked .10-.13em. On the TV it runs at --display-l (5.5vh) and the countdown numeral at --display-xl (11vh).</p>

</body>
</html>
