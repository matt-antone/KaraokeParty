<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark & mark" subtitle="Stacked Michroma wordmark; the mark is the volume knob" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .knob{position:relative;border-radius:50%;background:linear-gradient(145deg,#3a3d42,#1a1c1e);box-shadow:var(--bevel);display:grid;place-items:center}
  .knob i{width:52%;height:52%;border-radius:50%;background:linear-gradient(145deg,#222427,#2f3237);box-shadow:var(--well-deep)}
  .knob b{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:7.5%;min-width:2px;height:20%;border-radius:2px;background:var(--vu)}
</style>
</head>
<body>

<div class="row" style="gap:34px">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="knob" style="width:56px;height:56px"><i></i><b></b></div>
    <div style="font-family:var(--font-display);font-size:19px;letter-spacing:.13em;line-height:1.55">KARAOKE<br><span style="color:var(--vu)">PARTY</span></div>
  </div>
  <div style="text-align:center"><div class="knob" style="width:40px;height:40px;margin:0 auto"><i></i><b></b></div><span class="lbl" style="display:block;margin-top:10px">40px</span></div>
  <div style="text-align:center"><div class="knob" style="width:28px;height:28px;margin:0 auto"><i></i><b></b></div><span class="lbl" style="display:block;margin-top:10px">28px min</span></div>
</div>
<p class="note">There is no logo image and none should be drawn: both are CSS geometry in <code>components/core/Logo.jsx</code>. KARAOKE in --ink over PARTY in amber, tracked .13em — two channel labels silkscreened on a panel. The mark is the same knob the transport uses.</p>

</body>
</html>
