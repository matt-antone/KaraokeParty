<!-- @dsCard group="Colors" viewport="700x180" name="Ink" subtitle="Five levels of warm off-white; nothing is pure white" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  
</style>
</head>
<body>

<div class="grid" style="grid-template-columns:repeat(5,1fr)">
  <div class="sw" style="background:var(--ink)"><span style="color:var(--on-vu)">--ink · primary</span></div>
  <div class="sw" style="background:var(--ink-2)"><span style="color:var(--on-vu)">--ink-2 · secondary</span></div>
  <div class="sw" style="background:var(--ink-3)"><span style="color:var(--on-vu)">--ink-3 · meta</span></div>
  <div class="sw" style="background:var(--ink-4)"><span style="color:var(--ink)">--ink-4 · spent</span></div>
  <div class="sw" style="background:var(--ink-5)"><span style="color:var(--ink)">--ink-5 · unlit</span></div>
</div>
<p class="note">--ink is #e6e4de, warm off-white: pure white on graphite reads as a screen, not a panel. --ink-4 is "already sung", --ink-5 is "off" — an unlit icon or an empty meter segment.</p>

</body>
</html>
