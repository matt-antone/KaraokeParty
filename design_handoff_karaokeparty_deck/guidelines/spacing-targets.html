<!-- @dsCard group="Spacing" viewport="700x210" name="Targets & rows" subtitle="Phone only: 44px minimum, fixed row heights per list" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  
</style>
</head>
<body>

<div style="display:flex;align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:120px;height:46px;background:var(--brush);box-shadow:var(--bevel);border-radius:var(--radius-key);display:flex;align-items:center;padding-left:10px;box-sizing:border-box;font-size:11px;color:var(--ink-2)">artist folder</div><span class="lbl" style="display:block;margin-top:6px">46px</span><span class="lbl" style="font-size:8.5px">--row-artist</span></div><div style="text-align:center"><div style="width:120px;height:56px;background:var(--brush);box-shadow:var(--bevel);border-radius:var(--radius-key);display:flex;align-items:center;padding-left:10px;box-sizing:border-box;font-size:11px;color:var(--ink-2)">song key</div><span class="lbl" style="display:block;margin-top:6px">56px</span><span class="lbl" style="font-size:8.5px">--row-song</span></div><div style="text-align:center"><div style="width:120px;height:86px;background:var(--brush);box-shadow:var(--bevel);border-radius:var(--radius-key);display:flex;align-items:center;padding-left:10px;box-sizing:border-box;font-size:11px;color:var(--ink-2)">queue channel</div><span class="lbl" style="display:block;margin-top:6px">86px</span><span class="lbl" style="font-size:8.5px">--row-queue</span></div>
  <div style="text-align:center;margin-left:14px"><div style="width:44px;height:44px;border:1px dashed var(--vu);border-radius:var(--radius-key)"></div><span class="lbl" style="display:block;margin-top:6px">44&times;44</span><span class="lbl" style="font-size:8.5px">--target</span></div>
  <div style="text-align:center"><div style="width:46px;height:46px;background:var(--key-face);box-shadow:var(--bevel);border-radius:var(--radius-key)"></div><span class="lbl" style="display:block;margin-top:6px">46&times;46</span><span class="lbl" style="font-size:8.5px">--target-l</span></div>
</div>
<p class="note">There is no desktop layout. Content is a single 390-ish column with fixed chrome top and bottom; wider screens centre it rather than reflowing into columns.</p>

</body>
</html>
