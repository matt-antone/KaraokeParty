<!-- @dsCard group="Effects" viewport="700x170" name="Radii & focus" subtitle="3 for keys, 4 for panels, hard amber focus ring" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  
</style>
</head>
<body>

<div class="row" style="gap:24px">
  <div style="text-align:center"><div style="width:110px;height:56px;background:var(--key-face);box-shadow:var(--bevel);border-radius:3px"></div><span class="lbl" style="display:block;margin-top:8px">3px --radius-key</span></div>
  <div style="text-align:center"><div style="width:110px;height:56px;background:var(--brush);box-shadow:var(--bevel);border-radius:4px"></div><span class="lbl" style="display:block;margin-top:8px">4px --radius-panel</span></div>
  <div style="text-align:center"><div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#3d4046,#1c1e21);box-shadow:var(--bevel)"></div><span class="lbl" style="display:block;margin-top:8px">50% knobs only</span></div>
  <div style="text-align:center"><button style="min-height:44px;padding:0 20px;border:none;border-radius:3px;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink);background:var(--key-face);box-shadow:var(--bevel),var(--focus-ring)">Focused</button><span class="lbl" style="display:block;margin-top:8px">--focus-ring</span></div>
</div>
<p class="note">Small radii throughout — machined edges, not moulded plastic. Knobs and radio buttons are the only circles. Focus is a hard 2px amber ring with a chassis-coloured gap; never a blur.</p>

</body>
</html>
