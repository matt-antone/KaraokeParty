<!-- @dsCard group="Colors" viewport="700x180" name="Signal" subtitle="One signal colour, one indicator, one fault — and nothing else" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  
</style>
</head>
<body>

<div class="grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw" style="background:var(--vu)"><span style="color:var(--on-vu)">--vu · signal</span></div>
  <div class="sw" style="background:var(--vu-dim)"><span style="color:var(--ink)">--vu-dim · low</span></div>
  <div class="sw" style="background:var(--standby)"><span style="color:var(--on-vu)">--standby · queued</span></div>
  <div class="sw" style="background:var(--alert)"><span style="color:var(--ink)">--alert · fault</span></div>
</div>
<p class="note">Amber is level, progress, now playing, your row, and the one primary action. Teal is armed-but-not-running: a queued song. Red is a fault or a destructive key. Wanting a fifth colour means wanting a fifth indicator — reconsider.</p>

</body>
</html>
