<!-- @dsCard group="Colors" viewport="700x200" name="Graphite" subtitle="Chassis, faceplate, keys and wells — machined in steps of light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  
</style>
</head>
<body>

<div class="grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw" style="background:var(--chassis-deep)"><span style="color:var(--ink)">--chassis-deep</span></div>
  <div class="sw" style="background:var(--chassis)"><span style="color:var(--ink)">--chassis</span></div>
  <div class="sw" style="background:var(--key-well)"><span style="color:var(--ink)">--key-well</span></div>
  <div class="sw" style="background:var(--faceplate-lo)"><span style="color:var(--ink)">--faceplate-lo</span></div>
  <div class="sw" style="background:var(--faceplate)"><span style="color:var(--ink)">--faceplate</span></div>
  <div class="sw" style="background:var(--faceplate-hi)"><span style="color:var(--ink)">--faceplate-hi</span></div>
  <div class="sw" style="background:var(--key)"><span style="color:var(--ink)">--key</span></div>
  <div class="sw" style="background:var(--key-hi)"><span style="color:var(--ink)">--key-hi</span></div>
</div>
<p class="note">Six steps across 13 lightness points. The difference between a key and the panel it sits on is 4-5 points plus a bevel — never a hue shift, never a border.</p>

</body>
</html>
