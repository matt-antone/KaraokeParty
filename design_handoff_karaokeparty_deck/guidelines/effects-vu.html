<!-- @dsCard group="Effects" viewport="700x210" name="The VU meter" subtitle="One readout language for every continuous quantity" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; gap: 6px; }
  .sw { height: 46px; border-radius: var(--radius-key); display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; }
  .sw span { font-family: var(--font-mono); font-size: 8.5px; white-space: nowrap; }
  .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .note { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-2); margin: 12px 0 0; }
  .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .vu{display:flex;gap:2px;height:12px}
  .vu.thin{height:6px}
  .vu i{flex:1;border-radius:1px;background:var(--key-well);box-shadow:var(--well)}
  .vu i.on{background:var(--vu-dim);box-shadow:none}
  .vu i.hot{background:var(--vu);box-shadow:none}
  .vu i.pk{background:var(--alert);box-shadow:none}
</style>
</head>
<body>

<div class="col" style="gap:14px">
  <div><span class="lbl">room level 0.72</span><div class="vu" style="margin-top:6px"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div></div>
  <div><span class="lbl">scan progress 0.42 · peaking disabled</span><div class="vu thin" style="margin-top:6px"><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div></div>
  <div><span class="lbl">queue depth 8 of 20 · on the player</span><div class="vu thin" style="margin-top:6px"><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div></div>
</div>
<p class="note">Unlit segments are wells; lit segments sit flush. Low signal is --vu-dim, working level is --vu, and the top 14% is --alert. Progress readouts switch peaking off, because 90% done is good news.</p>

</body>
</html>
